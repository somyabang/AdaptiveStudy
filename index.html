<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Adaptive Study Companion</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f6f5fb;
        --cd: #fff;
        --tx: #1d1b2e;
        --mu: #6b6882;
        --ac: #6c4cf1;
        --ok: #17a673;
        --wr: #e5484d;
        --bd: #e4e1f0;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #15131f;
          --cd: #1f1c2e;
          --tx: #ece9fb;
          --mu: #9a96b5;
          --ac: #8b72ff;
          --bd: #2f2b45;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #15131f;
        --cd: #1f1c2e;
        --tx: #ece9fb;
        --mu: #9a96b5;
        --ac: #8b72ff;
        --bd: #2f2b45;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: auto;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      header {
        padding: 14px 16px 4px;
        max-width: 900px;
        margin: auto;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      small,
      .mu {
        color: var(--mu);
      }
      #nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 8px 16px;
        max-width: 900px;
        margin: auto;
      }
      #nav button {
        white-space: nowrap;
      }
      main {
        max-width: 900px;
        margin: auto;
        padding: 8px 16px 80px;
        display: grid;
        gap: 12px;
      }
      .cd {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 14px;
      }
      .cd h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .g {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      }
      .big {
        font-size: 26px;
        font-weight: 700;
      }
      button {
        font: inherit;
        border: 1px solid var(--bd);
        background: var(--cd);
        color: var(--tx);
        padding: 7px 12px;
        border-radius: 10px;
        cursor: pointer;
      }
      button.on,
      button.p {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      button.d {
        color: var(--wr);
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--tx);
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 7px 10px;
        max-width: 100%;
      }
      textarea {
        width: 100%;
        min-height: 80px;
      }
      .r {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .bar {
        height: 8px;
        background: var(--bd);
        border-radius: 6px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ac);
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 0;
        border-top: 1px solid var(--bd);
        align-items: center;
        flex-wrap: wrap;
      }
      .clk {
        font-size: 52px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }
      .cal i {
        aspect-ratio: 1;
        border-radius: 5px;
        background: var(--bd);
      }
      .cal i.a {
        background: var(--ok);
      }
      .bars {
        display: flex;
        gap: 6px;
        align-items: flex-end;
        height: 80px;
      }
      .bars div {
        flex: 1;
        background: var(--ac);
        border-radius: 4px 4px 0 0;
        min-height: 2px;
      }
      .tag {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 20px;
        background: var(--bd);
      }
      .bd {
        opacity: 0.35;
      }
      .bd.u {
        opacity: 1;
      }
      #gb {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        max-width: 900px;
        margin: 0 auto;
      }
      #gb .cd {
        border-color: var(--ac);
        margin: 6px 16px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 40px);
        background: var(--ac);
        color: #fff;
        padding: 10px 16px;
        border-radius: 12px;
        opacity: 0;
        transition: 0.25s;
        max-width: 90%;
        z-index: 9;
        text-align: center;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .ch {
        padding: 8px 10px;
        border-radius: 10px;
        margin: 6px 0;
        background: var(--bg);
      }
      .ch.u {
        background: var(--ac);
        color: #fff;
        margin-left: 20%;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        margin: 5px 0;
      }
      .ok {
        border-color: var(--ok) !important;
      }
      .no {
        border-color: var(--wr) !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>📚 Adaptive Study Companion</h1>
      <small>Plan · Learn · Test · Refocus · Improve</small>
      <div class="r" style="margin-top: 8px">
        <input
          id="cmd"
          placeholder="Try: start timer, pause, show hours, what next, explain arrays"
          style="flex: 1; min-width: 200px"
          onkeydown="if (event.key == 'Enter') cmd(this.value);"
        /><button onclick="cmd($('#cmd').value)">Go</button
        ><button id="mic" onclick="mic()" hidden>🎙️</button
        ><button onclick="theme()" title="Light or dark">🌗</button
        ><button onclick="snd()" title="Sound alerts">🔔</button
        ><button onclick="demo()">▶ Demo data</button>
      </div>
    </header>
    <div id="gb"></div>
    <div id="nav"></div>
    <main id="main"></main>
    <div id="toast"></div>
    <script>
      const $ = (q) => document.querySelector(q),
        E = (s) =>
          String(s ?? "").replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          ),
        ago = (n) => {
          const d = new Date();
          d.setDate(d.getDate() - n);
          return d.toLocaleDateString("en-CA");
        },
        TD = () => ago(0),
        dl = (d) =>
          Math.round(
            (new Date(d + "T00:00:00") - new Date(TD() + "T00:00:00")) / 864e5,
          ),
        pad = (x) => String(x).padStart(2, "0"),
        fmt = (s) =>
          pad((s / 3600) | 0) +
          ":" +
          pad(((s / 60) | 0) % 60) +
          ":" +
          pad(Math.floor(s % 60)),
        hS = (m) => pad((m / 60) | 0) + ":" + pad(m % 60),
        hm = (s) => {
          const [a, b] = s.split(":");
          return +a * 60 + +b;
        },
        nl = (t) => E(t).replace(/\n/g, "<br>");
      let S;
      try {
        S = JSON.parse(localStorage.getItem("asc"));
      } catch (e) {}
      S = Object.assign(
        {
          tasks: [],
          sess: [],
          xp: 0,
          days: {},
          cards: [],
          jr: [],
          exams: [],
          weak: [],
          notes: "",
          free: 180,
          cls: 0,
          goal: 120,
          quizzes: [],
          sched: [],
          dq: 0,
          rev: 0,
          why: "Add tasks and I will build your plan.",
        },
        S || {},
      );
      const save = () => {
        try {
          localStorage.setItem("asc", JSON.stringify(S));
        } catch (e) {}
      };
      const C = {
        start:
          "You don’t need to finish everything right now. Just start with one task.",
        dist: "It’s okay to lose focus sometimes. Take a breath and begin again.",
        done: "One more task done! You’re building consistency, one session at a time.",
        miss: "No worries. Your plan can change. Let’s find a fresh time to continue.",
        brk: "You’ve been putting in effort. Take a short break, then come back when you’re ready.",
        goal: "You showed up and completed your goal. Celebrate your progress!",
      };
      const TABS = [
        ["dash", "Dashboard"],
        ["plan", "Planner"],
        ["time", "Timer"],
        ["guard", "Focus"],
        ["ai", "AI Tutor"],
        ["rev", "Revise"],
        ["exam", "Exams"],
      ];
      let tab = "dash",
        at = "doubt",
        T = {
          mode: "study",
          run: 0,
          st: 0,
          acc: 0,
          tid: "",
          sub: "",
          pomo: 0,
          long: 0,
        },
        G = null,
        D = [],
        qz = null,
        rv = null,
        SM = null,
        wk = null,
        tt,
        dt,
        lastChk = 0;
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("on"), 4200);
      }
      function ping(m) {
        toast(m);
        beep();
        try {
          if (Notification.permission == "granted")
            new Notification("Study Companion", { body: m });
        } catch (e) {}
      }
      function xp(n, w) {
        S.xp += n;
        toast("+" + n + " XP · " + w);
        save();
      }
      const why = (r) => {
        S.why = r;
        save();
      };
      const ses = (f) => S.sess.filter((s) => s.m == "study" && f(s)),
        sum = (a) => a.reduce((x, s) => x + s.s, 0),
        secOn = (d) => sum(ses((s) => s.d == d));
      function streak() {
        let n = 0,
          i = S.days[TD()] ? 0 : 1;
        while (S.days[ago(i)]) {
          n++;
          i++;
        }
        return n;
      }
      const tn = (id) =>
        (S.tasks.find((t) => t.id == id) || { title: "Free study" }).title;
      function plan() {
        let left = Math.max(0, S.free - S.cls);
        const o = S.tasks
            .filter((t) => !t.done)
            .map((t) => {
              const d = dl(t.due);
              return {
                t,
                d,
                sc:
                  t.imp * 3 +
                  12 / (Math.max(d, 0) + 1) +
                  (d < 0 ? 5 : 0) +
                  (S.weak.some(
                    (w) => w.toLowerCase() == (t.sub || "").toLowerCase(),
                  )
                    ? 2
                    : 0),
              };
            })
            .sort((a, b) => b.sc - a.sc),
          run = [],
          def = [];
        for (const x of o) {
          const rem = Math.max(5, x.t.dur - (x.t.sp || 0));
          if (rem <= left) {
            run.push({ ...x, m: rem });
            left -= rem;
          } else if (left >= 15) {
            run.push({ ...x, m: left, part: 1 });
            left = 0;
          } else def.push(x);
        }
        return { run, def, left };
      }
      const bd = [
        [
          "First Focus",
          "Complete a study session",
          () => S.sess.some((s) => s.m == "study" && s.s >= 90),
        ],
        [
          "Consistency Star",
          "Study on 3 different days",
          () => Object.keys(S.days).length >= 3,
        ],
        ["Goal Getter", "Reach daily goal", () => !!S.gd],
        [
          "Doubt Destroyer",
          "Ask a doubt, then finish a quiz",
          () => S.dq > 0 && S.quizzes.length > 0,
        ],
        [
          "Focus Champion",
          "5 valid focus sessions",
          () => ses((s) => s.s >= 90).length >= 5,
        ],
        ["Revision Master", "Finish a revision session", () => S.rev > 0],
      ];
      const el = () => T.acc + (T.run ? (Date.now() - T.st) / 1000 : 0);
      const lim = () =>
          T.fast
            ? T.mode == "study"
              ? 10
              : 5
            : (T.mode == "study" ? 25 : T.long ? 15 : 5) * 60,
        disp = () => fmt(T.pomo ? Math.max(0, lim() - el()) : el());
      function pomoNext() {
        const w = T.mode == "study";
        fin();
        if (w) {
          S.pc = (S.pd == TD() ? S.pc : 0) + 1;
          S.pd = TD();
          T.long = S.pc % 4 == 0;
          T.mode = "break";
          ping(
            T.long
              ? "🍅 Pomodoro done! Long 15-minute break."
              : "🍅 Pomodoro done! 5-minute break.",
          );
        } else {
          T.mode = "study";
          T.long = 0;
          ping("Break over. Next focus round starts now.");
        }
        T.st = Date.now();
        T.run = 1;
        save();
        render();
      }
      function tgl() {
        if (T.run) {
          T.acc = el();
          T.run = 0;
        } else {
          T.st = Date.now();
          T.run = 1;
          if (T.mode == "study" && !T.acc) toast(C.start);
        }
        render();
      }
      function rst() {
        T.run = 0;
        T.acc = 0;
        T.bs = 0;
        render();
      }
      function setMode(m) {
        if (el() > 4) fin();
        T.mode = m;
        render();
      }
      function fin() {
        const s = Math.round(el());
        T.run = 0;
        if (s < 5) return rst();
        const t = S.tasks.find((t) => t.id == T.tid),
          sub = t ? t.sub : T.sub || "General";
        S.sess.push({ d: TD(), s, m: T.mode, sub, tid: T.tid });
        if (T.mode == "study") {
          if (t) t.sp = (t.sp || 0) + Math.round(s / 60);
          if (s >= 90) {
            S.days[TD()] = 1;
            xp(20, "session completed");
            if (s >= 1500) xp(5, "long focus bonus");
          } else toast("Saved, but under 1:30 so no streak or XP");
          if (secOn(TD()) >= S.goal * 60 && S.gd != TD()) {
            S.gd = TD();
            xp(25, "daily goal reached");
            setTimeout(() => toast(C.goal), 1500);
          }
          if (t)
            why(
              `You studied “${t.title}” for ${Math.round(s / 60)} min, so its remaining time shrank and the plan was recalculated.`,
            );
        } else toast(C.brk);
        T.acc = 0;
        T.bs = 0;
        save();
        render();
      }
      const hasT = (f) => S.tasks.push(f);
      function addTask() {
        const t = $("#tt").value.trim();
        if (!t) return;
        S.tasks.push({
          id: Date.now(),
          title: t,
          sub: $("#ts").value.trim() || "General",
          due: $("#td").value || ago(-3),
          imp: +$("#ti").value,
          dur: +$("#tm").value || 30,
        });
        why(
          `Added “${t}”. Priorities recalculated by deadline and importance.`,
        );
        save();
        render();
      }
      function doneTask(id) {
        const t = S.tasks.find((t) => t.id == id);
        if (!t || t.done) return;
        t.done = 1;
        if (!t.x) {
          t.x = 1;
          xp(15, "task completed");
        }
        why(
          `“${t.title}” is complete, so it was removed and remaining tasks re-prioritised.`,
        );
        toast(C.done);
        render();
      }
      function delTask(id) {
        S.tasks = S.tasks.filter((t) => t.id != id);
        save();
        render();
      }
      function setTime() {
        S.free = +$("#fr").value || 0;
        S.cls = +$("#cl").value || 0;
        S.goal = +$("#gl").value || 60;
        why(
          `Available time changed to ${Math.max(0, S.free - S.cls)} min today. The plan was re-fitted and lower-priority work moved out if needed.`,
        );
        render();
      }
      function auto() {
        const p = plan();
        let n = new Date(),
          m = Math.ceil((n.getHours() * 60 + n.getMinutes() + 10) / 5) * 5;
        S.sched = S.sched.filter((x) => x.st != "pending");
        p.run.forEach((x) => {
          S.sched.push({
            id: Date.now() + Math.random(),
            tid: x.t.id,
            at: hS(m % 1440),
            st: "pending",
          });
          m += x.m + 10;
        });
        why(
          "Timetable generated in your free slots with 10-minute gaps between sessions.",
        );
        save();
        toast("Sessions scheduled. Check the Focus tab.");
        render();
      }
      function chk() {
        const n = new Date(),
          nm = n.getHours() * 60 + n.getMinutes();
        let ch = 0;
        S.sched.forEach((x) => {
          if (x.st != "pending") return;
          const a = x.sn ?? hm(x.at);
          if (nm >= a + 15) {
            x.st = "missed";
            x.nw = hS((Math.ceil((nm + 30) / 15) * 15) % 1440);
            G = { id: x.id, k: "miss" };
            why(
              `You missed “${tn(x.tid)}”. Completed work is kept; the unfinished part moves to ${x.nw}.`,
            );
            ping(C.miss);
            ch = 1;
          } else if (nm >= a && !G) {
            G = { id: x.id, k: "due" };
            ping("Time to study: " + tn(x.tid));
            ch = 1;
          }
        });
        if (ch) {
          save();
          render();
        }
      }
      function paintG() {
        const b = $("#gb");
        if (!G) {
          b.innerHTML = "";
          return;
        }
        const x = S.sched.find((s) => s.id == G.id) || {};
        let h = "";
        if (G.k == "due")
          h = `<b>⏰ Time for ${E(tn(x.tid))}</b><div class="r"><button class="p" onclick="gs()">Start</button><button onclick="gz()">Snooze 5m</button><button onclick="gx()">Dismiss</button></div>`;
        if (G.k == "miss")
          h = `<b>${C.miss}</b><br>Fresh time suggested: <b>${x.nw}</b><div class="r"><button class="p" onclick="ga()">Accept ${x.nw}</button><button onclick="gx()">Dismiss</button></div>`;
        if (G.k == "dist")
          h = `<b>${C.dist}</b><div class="r"><button class="p" onclick="gr()">Resume</button><button onclick="gz()">Snooze 5m</button><button onclick="gx()">Dismiss</button></div>`;
        b.innerHTML = `<div class="cd">${h}</div>`;
      }
      function gs() {
        const x = S.sched.find((s) => s.id == G.id);
        if (x) x.st = "started";
        T.tid = x ? x.tid : "";
        T.mode = "study";
        if (!T.run) {
          T.acc = 0;
          tgl();
        }
        G = null;
        tab = "time";
        save();
        render();
      }
      function gz() {
        const n = new Date(),
          x = G && S.sched.find((s) => s.id == G.id);
        if (x) x.sn = n.getHours() * 60 + n.getMinutes() + 5;
        G = null;
        toast("Snoozed for 5 minutes");
        save();
        render();
      }
      function gx() {
        const x = S.sched.find((s) => s.id == G.id);
        if (x && x.st == "pending") x.st = "dismissed";
        G = null;
        save();
        render();
      }
      function ga() {
        const x = S.sched.find((s) => s.id == G.id);
        x.at = x.nw;
        x.st = "pending";
        x.sn = undefined;
        G = null;
        toast("Rescheduled to " + x.at);
        save();
        render();
      }
      function gr() {
        G = null;
        if (T.acc > 0 && !T.run) tgl();
        else {
          tab = "time";
          render();
        }
      }
      function dist() {
        G = { k: "dist" };
        if (T.run) {
          T.acc = el();
          T.run = 0;
        }
        ping(C.dist);
        clearTimeout(dt);
        dt = setTimeout(() => {
          if (G && G.k == "dist")
            ping("Gentle reminder: ready to resume? " + C.dist);
        }, 3e5);
        render();
      }
      async function notif() {
        try {
          const r = await Notification.requestPermission();
          toast("Notifications: " + r);
        } catch (e) {
          toast("Notifications not supported here");
        }
      }
      function badges() {
        return bd.map((b) => ({ n: b[0], d: b[1], u: b[2]() }));
      }
      function coach() {
        const t = secOn(TD());
        if (t >= S.goal * 60) return C.goal;
        if (S.sched.some((x) => x.st == "missed")) return C.miss;
        if (!t) return C.start;
        return T.run
          ? "You’re in the zone. Keep going."
          : "Nice work so far. Pick your next task when ready.";
      }
      const card = (t, h) => `<div class="cd"><h3>${t}</h3>${h}</div>`;
      const V = {
        dash() {
          const t = TD(),
            ts = secOn(t),
            pc = Math.min(100, ((ts / (S.goal * 60)) * 100) | 0),
            sub = {};
          S.sess
            .filter((s) => s.m == "study")
            .forEach((s) => (sub[s.sub] = (sub[s.sub] || 0) + s.s));
          const mx = Math.max(1, ...Object.values(sub)),
            w = sum(ses((s) => dl(s.d) > -7)),
            mo = sum(ses((s) => dl(s.d) > -30)),
            brk = sum(S.sess.filter((s) => s.m == "break")),
            rec = Math.max(0, ...ses(() => 1).map((s) => s.s)),
            dm = [6, 5, 4, 3, 2, 1, 0].map((i) => secOn(ago(i))),
            dx = Math.max(1, ...dm);
          const hm_ = (s) =>
            ((s / 3600) | 0) + "h " + (((s / 60) | 0) % 60) + "m";
          return (
            card("Coach", `<p style="margin:0">💬 ${coach()}</p>`) +

        $("#qs").textContent = "Generating…";
        try {
          const r = await aij(
            `Create 5 multiple-choice questions on "${t}" for a student. JSON array of {"q":string,"o":[4 strings],"a":correct index 0-3,"e":short explanation}.`,
          );
          qz = { topic: t, qs: r, i: 0, sc: 0, wr: [], a: null };
          render();
        } catch (e) {
          $("#qs").textContent = e.message || "AI error";
        }
      }
      function pick(j) {
        if (qz.a != null) return;
        qz.a = j;
        const q = qz.qs[qz.i];
        if (j == q.a) qz.sc++;
        else qz.wr.push(q.q);
        render();
      }
      function nxt() {
        if (qz.i >= qz.qs.length) {
          S.quizzes.push({
            d: TD(),
            topic: qz.topic,
            sc: qz.sc,
            n: qz.qs.length,
            wrong: qz.wr,
          });
          xp(10, "quiz finished");
          if (qz.sc / qz.qs.length < 0.7 && !S.weak.includes(qz.topic))
            S.weak.push(qz.topic);
          save();
        }
        render();
      }
      async function findWeak() {
        const data = {
          quizzes: S.quizzes.slice(-6),
          difficult: S.jr.map((j) => j.df).filter(Boolean),
          hardCards: S.cards.filter((c) => c.h).map((c) => c.q),
        };
        if (
          !data.quizzes.length &&
          !data.difficult.length &&
          !data.hardCards.length
        ) {
          toast("No quiz or journal data yet. Take a quiz first.");
          return;
        }
        $("#wk").textContent = "Analysing…";
        try {
          wk = await aij(
            "Using ONLY this real study data, list weak topics: " +
              JSON.stringify(data) +
              '. JSON array of {"topic","why","next"}.',
          );
          render();
        } catch (e) {
          $("#wk").textContent = e.message || "AI error";
        }
      }
      function addWeak() {
        wk.forEach((w) => {
          if (!S.weak.includes(w.topic)) S.weak.push(w.topic);
          S.tasks.push({
            id: Date.now() + Math.random(),
            title: "Revise " + w.topic,
            sub: w.topic,
            due: ago(-1),
            imp: 4,
            dur: 25,
          });
        });
        why(
          "Weak topics from your quiz and journal data were added as revision tasks.",
        );
        save();
        toast("Added to plan");
        tab = "plan";
        render();
      }
      function upl(i) {
        const f = i.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          $("#nt").value = r.result;
          toast("Loaded. Press Save.");
        };
        r.readAsText(f);
      }
      async function askN() {
        const q = $("#nq").value.trim(),
          n = $("#nt").value;
        if (!q || !n.trim()) {
          toast("Add notes and a question");
          return;
        }
        S.notes = n;
        save();
        $("#na").innerHTML = `<div class="ch">Thinking…</div>`;
        try {
          const a = await ai(
            "Answer using ONLY the notes below. If the answer is not in the notes, say exactly: This is not in your notes. Then optionally give a short general hint.\nNOTES:\n" +
              n +
              "\nQUESTION: " +
              q,
          );
          $("#na").innerHTML = `<div class="ch">${nl(a)}</div>`;
        } catch (e) {
          $("#na").innerHTML = `<div class="ch">${E(e.message)}</div>`;
        }
      }
      function addCard() {
        const q = $("#fq").value.trim(),
          a = $("#fa").value.trim();
        if (q && a) {
          S.cards.push({ q, a });
          save();
          render();
        }
      }
      async function genCards() {
        const t = $("#ft").value.trim(),
          src = t ? `the topic "${t}"` : "these notes:\n" + S.notes;
        if (!t && !S.notes.trim()) {
          toast("Enter a topic or save notes first");
          return;
        }
        try {
          const r = await aij(
            "Make 6 flashcards from " + src + '. JSON array of {"q","a"}.',
          );
          S.cards.push(...r);
          save();
          render();
        } catch (e) {
          toast(e.message || "AI error");
        }
      }
      function rate(h) {
        S.cards[rv.i].h = h;
        rv.i++;
        rv.s = 0;
        if (rv.i >= S.cards.length) {
          rv = null;
          S.rev++;
          if (S.rd != TD()) {
            S.rd = TD();
            xp(10, "revision session");
          } else toast("Review complete");
        }
        save();
        render();
      }
      function revTask() {
        S.tasks.push({
          id: Date.now(),
          title: "Flashcard revision",
          sub: "Revision",
          due: ago(-1),
          imp: 3,
          dur: 15,
        });
        why("A revision session was added to the planner.");
        save();
        toast("Added");
        render();
      }
      function saveJ() {
        const l = $("#j1").value.trim();
        if (!l) return;
        S.jr.push({ d: TD(), l, df: $("#j2").value, g: $("#j3").value });
        save();
        toast("Journal saved");
        render();
      }
      async function jAI() {
        const j = S.jr.slice(-5);
        if (!j.length) {
          toast("Save an entry first");
          return;
        }
        const o = $("#ja");
        o.hidden = 0;
        o.textContent = "Thinking…";
        try {
          o.innerHTML = nl(
            await ai(
              "From these journal entries, give 3 short revision suggestions:\n" +
                JSON.stringify(j),
            ),
          );
        } catch (e) {
          o.textContent = e.message;
        }
      }
      function cmd(t) {
        t = (t || "").toLowerCase().trim();
        if (!t) return;
        $("#cmd").value = "";
        let r;
        if (/start.*(timer|study)|^start$/.test(t)) {
          T.mode = "study";
          if (!T.run) tgl();
          tab = "time";
          render();
          r = "Study timer started.";
        } else if (/pause/.test(t)) {
          if (T.run) tgl();
          r = "Session paused.";
        } else if (/resume/.test(t)) {
          if (!T.run) tgl();
          r = "Resumed.";
        } else if (/hours|how long|study time/.test(t)) {
          const s = secOn(TD());
          r = `Today you studied ${(s / 3600) | 0} hours ${mins(s) % 60} minutes.`;
        } else if (/next|what should i study/.test(t)) {
          const p = plan().run[0];
          r = p
            ? `Study next: ${p.t.title} for ${p.m} minutes.`
            : "No tasks planned. Add some in the Planner.";
        } else {
          ask(t);
          return;
        }
        toast(r);
        speak(r);
      }
      function speak(t) {
        try {
          if (window.vsp) {
            speechSynthesis.cancel();
            speechSynthesis.speak(new SpeechSynthesisUtterance(t));
          }
        } catch (e) {}
      }
      function mic() {
        const R = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!R) return;
        const r = new R();
        window.vsp = 1;
        r.onresult = (e) => cmd(e.results[0][0].transcript);
        r.onerror = () => toast("Mic permission or speech failed");
        r.start();
        toast("Listening…");
      }
      if (window.SpeechRecognition || window.webkitSpeechRecognition)
        $("#mic").hidden = 0;
      setInterval(() => {
        const c = $("#clk");
        if (c) c.textContent = disp();
        if (T.pomo && T.run && el() >= lim()) pomoNext();
        if (!T.pomo && T.mode == "study" && T.run && el() >= 3000 && !T.bs) {
          T.bs = 1;
          ping(C.brk + " (50 minutes done)");
        }
        if (Date.now() - lastChk > 15000) {
          lastChk = Date.now();
          chk();
        }
      }, 500);
      render();
      if (window.claude && claude.use)
        claude
          .use("sample")
          .then((x) => {
            SM = x;
            if (tab == "ai") render();
          })
          .catch(() => {});
    </script>
  </body>
</html>
